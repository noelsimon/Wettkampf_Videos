<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualirouten Zittau</title>
<meta name="description" content="Videos der Qualifikationsrouten zum Anschauen für die Athlet*innen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  --brand:#114A7A; --brand-dark:#0B3459; --brand-tint:#EAF1F8;
  --bg:#F3F6FA; --surface:#FFFFFF; --sunken:#EEF3F9;
  --ink:#10151C; --muted:#5E7086; --line:#DCE6F0; --line-strong:#AFC2D6;
  --U9:#B87708; --U11:#1F7A55; --U13:#2559A6; --U15:#A93B34;
  --shadow:0 1px 2px rgba(16,21,28,.06), 0 12px 28px -18px rgba(16,21,28,.32);
  --r-md:14px; --r-lg:20px;
  --sans:"Poppins","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#6FA8D9; --brand-dark:#0B3459; --brand-tint:#16283A;
    --bg:#0D1219; --surface:#151C26; --sunken:#1B2431;
    --ink:#E6EDF5; --muted:#93A4B8; --line:#26323F; --line-strong:#3A4A5C;
    --U9:#E0A33A; --U11:#4FBF8C; --U13:#6F9FE6; --U15:#E07A70;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Kopf */
header.top{background:var(--brand-dark);color:#fff;padding:28px 0 22px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin:0 0 10px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.15;font-weight:600;margin:0 0 6px}
.sub{margin:0;opacity:.85}

/* Filter */
nav.filter{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;
  padding:7px 16px;font-weight:500;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0D1219}}

.hint{margin:18px 0 0;color:var(--muted);font-size:14px}

/* Klassen-Abschnitte */
section.cls{margin:28px 0 8px}
.cls-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.cls-head h2{margin:0;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.cls-head h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--c)}
.cls-head .meta{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .15s ease, border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/9;background:var(--sunken);display:grid;place-items:center;overflow:hidden}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb .play{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);
  display:grid;place-items:center}
.thumb .play svg{width:22px;height:22px;margin-left:3px;fill:#fff}
.thumb .rt{position:absolute;left:10px;top:10px;background:var(--c);color:#fff;font:600 15px/1 var(--mono);
  padding:6px 9px;border-radius:8px}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;
  font:500 12px/1 var(--mono);padding:4px 6px;border-radius:6px}
.card.missing .play{display:none}
.card.missing .thumb::after{content:"Video folgt";position:relative;color:var(--muted);font-weight:500}
.card-body{padding:12px 14px 14px}
.card-body b{display:block;font-weight:600;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.note{margin:8px 0 0;font-size:13px;color:var(--muted)}

@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card-body{padding:10px}
  .card-body b{font-size:15px}
  .tag{font-size:11px;padding:2px 7px}
  .thumb .play{width:40px;height:40px}
  .card.missing .thumb::after{margin-top:26px;font-size:13px}
  .chips{gap:6px}
  .chip{padding:7px 13px}
}
footer{color:var(--muted);font-size:13px;padding:36px 0 48px}

/* Player */
dialog{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;
  background:#000;color:#fff}
dialog::backdrop{background:#000}
.pl{display:flex;flex-direction:column;height:100%}
.pl-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:#0B0F14}
.pl-title{flex:1;min-width:0}
.pl-title b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-title span{font-size:13px;opacity:.7}
.ibtn{border:0;background:rgba(255,255,255,.1);border-radius:10px;min-width:42px;height:42px;
  display:grid;place-items:center;padding:0 10px;color:#fff}
.ibtn:hover{background:rgba(255,255,255,.18)}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pl-stage{flex:1;min-height:0;display:grid;place-items:center;background:#000}
.pl-stage video,.pl-stage iframe{width:100%;height:100%;border:0;object-fit:contain;background:#000}
.pl-stage .err{padding:24px;text-align:center;opacity:.8}
.pl-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));background:#0B0F14}
.pl-tools .lbl{font-size:13px;opacity:.7;margin-right:2px}
.speed{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;
  padding:6px 12px;font:500 13px/1 var(--mono);min-height:34px}
.speed[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.pl-tools .sp{flex:1}
.pl-note{padding:0 12px 10px;background:#0B0F14;font-size:14px;opacity:.85}
.pl-note:empty{display:none}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow" id="ort"></p>
    <h1>Videos der Qualirouten</h1>
    <p class="sub" id="wk"></p>
  </div>
</header>

<nav class="filter" aria-label="Wertungsklasse wählen">
  <div class="wrap chips" id="chips"></div>
</nav>

<main class="wrap">
  <p class="hint">Tippe auf eine Route, um das Video zu öffnen. Im Player kannst du die Geschwindigkeit
    verlangsamen und mit den Pfeilen zur nächsten Route wechseln.</p>
  <div id="list"></div>
</main>

<footer class="wrap">Die Videos dienen nur zur Vorbereitung auf die Qualifikation. Bitte nicht weitergeben oder hochladen.</footer>

<dialog id="player" aria-label="Videoplayer">
  <div class="pl">
    <div class="pl-bar">
      <button class="ibtn" id="close" aria-label="Schließen">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="pl-title"><b id="plT"></b><span id="plS"></span></div>
      <button class="ibtn" id="prev" aria-label="Vorherige Route">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ibtn" id="next" aria-label="Nächste Route">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="pl-stage" id="stage"></div>
    <div class="pl-note" id="plN"></div>
    <div class="pl-tools" id="tools">
      <span class="lbl">Tempo</span>
      <button class="speed" data-r="0.25">0.25×</button>
      <button class="speed" data-r="0.5">0.5×</button>
      <button class="speed" data-r="1" aria-pressed="true">1×</button>
      <button class="speed" data-r="1.5">1.5×</button>
      <span class="sp"></span>
      <button class="ibtn" id="back5" aria-label="5 Sekunden zurück" title="5 s zurück">−5 s</button>
      <button class="ibtn" id="fwd5" aria-label="5 Sekunden vor" title="5 s vor">+5 s</button>
    </div>
  </div>
</dialog>

<script src="videos.js"></script>
<script>
(function(){
  var WK = window.WETTKAMPF || {}, V = (window.VIDEOS || []).slice();
  V.forEach(function(v){ v.key = v.klasse + "_Quali" + v.quali; v.name = "Quali " + v.quali; });
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  $("ort").textContent = [WK.ort, WK.datum].filter(Boolean).join(" · ");
  $("wk").textContent = WK.titel || "";

  var classes = [];
  V.forEach(function(v){ if (classes.indexOf(v.klasse) < 0) classes.push(v.klasse); });
  var color = function(k){ return "var(--" + k + ", var(--brand))"; };

  function yt(src){
    var m = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(src || "");
    return m ? m[1] : null;
  }
  var fmt = function(s){ s = Math.round(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };

  /* ---------- Filter ---------- */
  var active = "alle";
  try { active = localStorage.getItem("qv-filter") || "alle"; } catch(e){}
  if (active !== "alle" && classes.indexOf(active) < 0) active = "alle";

  function renderChips(){
    $("chips").innerHTML = ["alle"].concat(classes).map(function(k){
      return '<button class="chip" data-k="' + esc(k) + '" aria-pressed="' + (k === active) + '">' +
        (k === "alle" ? "Alle Klassen" : esc(k)) + '</button>';
    }).join("");
  }
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    active = b.dataset.k;
    try { localStorage.setItem("qv-filter", active); } catch(e){}
    renderChips(); renderList();
  });

  /* ---------- Übersicht ---------- */
  function renderList(){
    var html = "";
    classes.forEach(function(k){
      if (active !== "alle" && active !== k) return;
      var items = V.filter(function(v){ return v.klasse === k; });
      html += '<section class="cls" style="--c:' + color(k) + '"><div class="cls-head"><h2>' + esc(k) +
        '</h2><span class="meta">' + items.length + (items.length === 1 ? " Qualiroute" : " Qualirouten") +
        (items[0] && items[0].modus ? " · " + esc(items[0].modus) : "") + '</span></div><div class="grid">';
      items.forEach(function(v){
        var i = V.indexOf(v), has = !!v.src, id = yt(v.src);
        var media = !has ? "" : id
          ? '<img alt="" src="https://i.ytimg.com/vi/' + esc(id) + '/hqdefault.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">'
          : '<video muted playsinline preload="metadata" src="' + esc(v.src) + '#t=2" data-i="' + i + '"></video>';
        html += '<button class="card' + (has ? "" : " missing") + '" data-i="' + i + '"' + (has ? "" : " disabled") +
          ' aria-label="' + esc(v.klasse) + ' ' + esc(v.name) + '">' +
          '<div class="thumb">' + media + '<span class="rt">Q' + esc(v.quali) + '</span>' +
          '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>' +
          '<span class="dur" hidden></span></div>' +
          '<div class="card-body"><b>' + esc(v.name) + '</b><div class="tags">' +
          '<span class="tag">' + esc(v.klasse) + '</span>' +
          (v.modus ? '<span class="tag">' + esc(v.modus) + '</span>' : "") + '</div>' +
          (v.notiz ? '<p class="note">' + esc(v.notiz) + '</p>' : "") + '</div></button>';
      });
      html += "</div></section>";
    });
    $("list").innerHTML = html;
    $("list").querySelectorAll(".thumb video").forEach(function(el){
      el.addEventListener("loadedmetadata", function(){
        var d = el.parentNode.querySelector(".dur");
        if (isFinite(el.duration)) { d.textContent = fmt(el.duration); d.hidden = false; }
      });
      el.addEventListener("error", function(){ el.remove(); });
    });
  }
  $("list").addEventListener("click", function(e){
    var c = e.target.closest(".card"); if (c && !c.disabled) open(+c.dataset.i);
  });

  /* ---------- Player ---------- */
  var dlg = $("player"), cur = -1, rate = 1;
  var playable = function(){ return V.map(function(v, i){ return v.src ? i : -1; }).filter(function(i){ return i >= 0; }); };

  function open(i){
    var v = V[i]; if (!v) return;
    cur = i;
    $("plT").textContent = v.klasse + " · " + v.name;
    $("plS").textContent = v.modus || "";
    $("plN").textContent = v.notiz || "";
    var id = yt(v.src), st = $("stage");
    if (id) {
      st.innerHTML = '<iframe allow="autoplay; fullscreen; picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/' +
        esc(id) + '?autoplay=1&rel=0&playsinline=1"></iframe>';
    } else {
      st.innerHTML = '<video controls playsinline autoplay preload="auto" src="' + esc(v.src) + '"></video>';
      var el = st.querySelector("video");
      el.playbackRate = rate;
      el.addEventListener("loadedmetadata", function(){ el.playbackRate = rate; });
      el.addEventListener("error", function(){
        st.innerHTML = '<div class="err">Das Video lässt sich in diesem Browser nicht abspielen.<br>' +
          '<a style="color:#fff" href="' + esc(v.src) + '">Video direkt öffnen</a></div>';
      });
    }
    $("tools").style.display = id ? "none" : "";
    var p = playable(), k = p.indexOf(i);
    $("prev").disabled = k <= 0; $("next").disabled = k < 0 || k >= p.length - 1;
    if (!dlg.open) dlg.showModal();
    if (location.hash !== "#" + v.key) history.replaceState(null, "", "#" + v.key);
  }
  function step(d){ var p = playable(), k = p.indexOf(cur) + d; if (k >= 0 && k < p.length) open(p[k]); }
  function vid(){ return $("stage").querySelector("video"); }

  $("close").onclick = function(){ dlg.close(); };
  dlg.addEventListener("close", function(){
    $("stage").innerHTML = ""; cur = -1;
    history.replaceState(null, "", location.pathname + location.search);
  });
  $("prev").onclick = function(){ step(-1); };
  $("next").onclick = function(){ step(1); };
  $("back5").onclick = function(){ var el = vid(); if (el) el.currentTime = Math.max(0, el.currentTime - 5); };
  $("fwd5").onclick = function(){ var el = vid(); if (el) el.currentTime = Math.min(el.duration || 1e9, el.currentTime + 5); };
  $("tools").addEventListener("click", function(e){
    var b = e.target.closest(".speed"); if (!b) return;
    rate = +b.dataset.r;
    $("tools").querySelectorAll(".speed").forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
    var el = vid(); if (el) el.playbackRate = rate;
  });
  document.addEventListener("keydown", function(e){
    if (!dlg.open) return;
    if (e.key === "ArrowRight" && e.shiftKey) step(1);
    else if (e.key === "ArrowLeft" && e.shiftKey) step(-1);
  });

  renderChips(); renderList();

  /* Direktlink, z. B. …/#Q7 */
  var h = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (h) V.forEach(function(v, i){ if (v.key.toUpperCase() === h && v.src) open(i); });
})();
</script>
</body>
</html>
